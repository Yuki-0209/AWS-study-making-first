name: Release 

on: 
  push: 
    branches: [main]

permissions: 
  contents: write
  pull-requests: write 

jobs: 
  release: 
    runs-on: ubuntu-latest

    steps: 
      - name: リポジトリをチェックアウト
        uses: actions/checkout@v6
        with: 
          fetch-depth: 0

      - name: Release Plaease を実行
        uses: googleapis/release-please-action@v4
        id: release
        with: 
          release-type: python
          token: ${{ secrets.GITHUB_TOKEN }}

      