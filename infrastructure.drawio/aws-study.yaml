AWSTemplateFormatVersion: '2010-09-09'
Description: Simple VPC with Public  EC2 Instances, and Security 
# VPCとサブネット、EC2インスタンス、セキュリティグループを作成するCloudFormationテンプレート
# PublicSubnetにはインターネットゲートウェイを介してインターネットアクセスが可能なEC2インスタンスを配置

Resources:
# VPCの作成
  MyVPC:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.0.0.0/16

# Publicサブネットの作成
  PublicSubnet:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref MyVPC
      CidrBlock: 10.0.1.0/24 
      MapPublicIpOnLaunch: true  

# インターネットゲートウェイの作成
  InternetGateway:
    Type: AWS::EC2::InternetGateway

# VPCへのインターネットゲートウェイアタッチ
  AttachGateway: 
    Type: AWS::EC2::VPCGatewayAttachment
    Properties: 
      VpcId: !Ref MyVPC
      InternetGatewayId: !Ref InternetGateway

# Publicルートテーブルの作成
  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref MyVPC

# Publicルートの作成    
  PublicRoute:
    Type: AWS::EC2::Route
    DependsOn: AttachGateway
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway
 
 # PublicサブネットとPublicルートテーブルの関連付け
  PublicSubnetRouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnet
      RouteTableId: !Ref PublicRouteTable

# Webサーバー用セキュリティグループの作成
  WebSecurityGroup: 
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Web SG 
      VpcId: !Ref MyVPC
      SecurityGroupIngress: 
        - IpProtocol: tcp
          FromPort: 22
          ToPort: 22
          CidrIp: 0.0.0.0/0
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0

# PublicサブネットのEC2インスタンス作成
  WebEC2:
    Type: AWS::EC2::Instance
    Properties: 
      ImageId: ami-03d1820163e6b9f5d
      InstanceType: t2.micro
      SubnetId: !Ref PublicSubnet
      SecurityGroupIds: 
        - !Ref WebSecurityGroup
      KeyName: aws-study



